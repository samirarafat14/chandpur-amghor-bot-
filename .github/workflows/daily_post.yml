name: Daily Mango Post

on:
  schedule:
    # Runs everyday at 4:00 AM UTC (10:00 AM Bangladesh Time)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger button

jobs:
  run-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Poster Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python main.py
